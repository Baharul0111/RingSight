<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">RingSight architecture</title><desc id="desc">A human investigator and read-only MCP clients access a single application. Its spending and safety gates protect a fixed-tool planner, evidence judge and verifier. A tenant FalkorDB graph stores evidence, memory and human decisions. Approval is available only to a named human.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#80dbc1"/></marker><style>text{font-family:system-ui,sans-serif;fill:#dce8f3}.title{font-size:27px;font-weight:650}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#99b4cb}.box{fill:#14283b;stroke:#36516a;stroke-width:1.2;rx:10}.line{fill:none;stroke:#80dbc1;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:6 5}</style></defs>
<rect width="1100" height="660" fill="#0c1724" rx="16"/><text x="45" y="56" class="title">RingSight</text><text x="45" y="82" class="small">Evidence → proposal → named human decision</text><text x="777" y="57" class="small">Track 01 (primary) · Track 02 (memory)</text>
<rect x="45" y="125" width="215" height="85" class="box"/><text x="65" y="155" class="label">Investigator console</text><text x="65" y="178" class="small">React · exact paths · IST / ₹</text><text x="65" y="195" class="small">Identity from server-side key</text>
<rect x="45" y="245" width="215" height="82" class="box"/><text x="65" y="276" class="label">External MCP client</text><text x="65" y="300" class="small">14 read-only typed tools</text><text x="65" y="317" class="small">Static bearer · origin checks</text>
<rect x="45" y="362" width="215" height="95" class="box"/><text x="65" y="393" class="label">Named human</text><text x="65" y="417" class="small">Approve / deny / modify</text><text x="65" y="438" class="small">Reason ≥ 20 characters</text>
<rect x="310" y="109" width="470" height="367" fill="#102131" stroke="#36516a" rx="14"/><text x="332" y="140" class="label">One application container · FastAPI</text>
<rect x="333" y="160" width="423" height="57" class="box"/><text x="350" y="184" class="label">Spend, rate &amp; safety gates</text><text x="350" y="202" class="small">Kill switch · daily cap · concurrency · bounded runs</text>
<rect x="333" y="241" width="423" height="84" class="box"/><text x="350" y="267" class="label">Planner → evidence-only judge → verifier</text><text x="350" y="289" class="small">Claude API · ids-only evidence · no generated Cypher</text><text x="350" y="309" class="small">Four outcomes · streamed trace · templated fallback</text>
<rect x="333" y="347" width="202" height="93" class="box"/><text x="348" y="373" class="label">Frozen tool catalogue</text><text x="348" y="395" class="small">14 reads public at /mcp</text><text x="348" y="416" class="small">2 writes in-process only</text>
<rect x="554" y="347" width="202" height="93" class="box"/><text x="570" y="373" class="label">Human approval route</text><text x="570" y="395" class="small">Not a model tool</text><text x="570" y="416" class="small">PO-only report approval</text>
<rect x="836" y="167" width="218" height="275" fill="#15332f" stroke="#508477" stroke-width="1.5" rx="14"/><text x="856" y="203" class="label">FalkorDB</text><text x="856" y="229" class="small">One graph per bank</text><path d="M854 245h182" stroke="#41695e"/><text x="856" y="270" class="small">Accounts · people · identifiers</text><text x="856" y="296" class="small">Transfers · restrictions · rails</text><text x="856" y="322" class="small">Findings · sessions · tool calls</text><text x="856" y="348" class="small">Proposals · decisions · cases</text><text x="856" y="374" class="small">Report drafts · spending</text><text x="856" y="410" class="small">SPpaths · WCC · LPA · PR · BC</text>
<path d="M260 166h50 M260 285h50 M260 409h50 M545 217v24 M433 325v22 M657 325v22 M780 287h56" class="line"/>
<rect x="309" y="520" width="470" height="88" class="box"/><text x="332" y="552" class="label">Recovery &amp; monitoring</text><text x="332" y="577" class="small">Deterministic seed + finding snapshot · reseed deadline</text><text x="332" y="596" class="small">Actions + Cloudflare crons · UptimeRobot · /health</text><path d="M779 565h166V442" class="line dash"/><text x="45" y="625" class="small">Synthetic demo only · no real filing · a hold never changes account status</text>
</svg>
