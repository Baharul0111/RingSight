name: Keep RingSight awake
on:
  schedule:
    - cron: '3-59/12 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe the graph and model health
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl -fsS --retry 1 --max-time 65 "$HEALTH_URL" > /dev/null
